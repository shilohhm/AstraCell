[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astracell"
version = "0.0.1"
description = "Observability-aware fault identifiability analysis for lithium-ion battery packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AstraCell" }]
keywords = ["battery", "prognostics", "fault-detection", "identifiability", "fisher-information"]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebook = [
    "jupyterlab>=4.0",
    "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astracell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "regression: pins a finding on one specific configuration, not a universal law",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells live in this file as string literals. Their "long lines" are markdown
# and LaTeX, not Python, and reflowing them would corrupt the notebook.
"scripts/build_notebook.py" = ["E501"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use 3.12+ `type` statements, so
# pinning below the interpreter version makes mypy fail inside numpy rather than
# inside astracell. Runtime support is still >=3.11 (see requires-python).
packages = ["astracell"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
